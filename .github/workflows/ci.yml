name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: getit
          POSTGRES_PASSWORD: getit
          POSTGRES_DB: getit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U getit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://getit:getit@localhost:5432/getit_test
      TEST_DATABASE_URL: postgresql://getit:getit@localhost:5432/getit_test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      DEVICE_SALT: ci-only-device-salt-not-for-production
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # The whole Playwright suite (incl. the full demo script) against a production build.
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: getit
          POSTGRES_PASSWORD: getit
          POSTGRES_DB: getit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U getit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://getit:getit@localhost:5432/getit
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      DEVICE_SALT: ci-only-device-salt-not-for-production
      CLIENT_ORIGIN: http://localhost:4000
      E2E_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npm start &
      - run: npx --yes wait-on@8 -t 60000 http-get://localhost:4000/api/health
      - run: npm run e2e -- --trace retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
